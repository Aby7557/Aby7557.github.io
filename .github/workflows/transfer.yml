# RepoMgr-Transfer-API: 1
# RepoMgr-Transfer-Template: 12
name: Cloud transfer deb
run-name: "RepoMgr ${{ inputs.task_id }}"

"on":
  workflow_dispatch:
    inputs:
      task_id:
        description: "Unique transfer identifier"
        required: true
      files:
        description: "JSON array of {url, filename}"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enforce publication branch
        shell: bash
        env:
          PUBLICATION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$PUBLICATION_BRANCH" ]; then
            echo 'Cloud transfer is only allowed on the default publication branch; no files were transferred or deployed.' | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install transfer and publisher tools
        run: sudo apt-get update && sudo apt-get install -y dpkg xz-utils bzip2 gzip zstd dpkg-dev gnupg
      - name: Download and commit
        id: transfer
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          python3 <<'PYTRANSFER'
          import json, os, re, subprocess, tempfile, hashlib, socket, ipaddress, tarfile, threading, signal, sys
          from urllib.parse import urlsplit, urljoin
          from pathlib import Path

          def public_url(url):
              if not isinstance(url,str) or len(url)>4096 or any(c.isspace() or ord(c)<32 for c in url) or "\\" in url:
                  raise ValueError('unsafe_url')
              p=urlsplit(url)
              if p.scheme!='https' or not p.hostname or p.username is not None or p.password is not None or '?' in url or '#' in url or p.port not in (None,443):
                  raise ValueError('unsafe_url')
              host=p.hostname.encode('idna').decode('ascii')
              if host.endswith('.') or not re.fullmatch(r'[A-Za-z0-9.-]+',host): raise ValueError('unsafe_url')
              try: addresses={entry[4][0] for entry in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)}
              except OSError: raise ValueError('dns_failed') from None
              if not addresses or any(not ipaddress.ip_address(ip).is_global or ipaddress.ip_address(ip).is_multicast for ip in addresses):
                  raise ValueError('unsafe_url')
              return host,sorted(addresses)[0]

          def download(url,tmp):
              # Resolve and pin each hop; never let curl follow an unchecked redirect or use a proxy.
              for _ in range(6):
                  host,ip=public_url(url)
                  pin='['+ip+']' if ':' in ip else ip
                  done=subprocess.run(['curl','--disable','-fsS','--proto','=https','--noproxy','*','--resolve',host+':443:'+pin,'--connect-timeout','15','--max-time','90','--max-filesize','41943040','--output',tmp,'--write-out','%{http_code}\n%header{cf-mitigated}\n%{redirect_url}','--',url],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  status,_,metadata=done.stdout.partition('\n')
                  mitigation,_,redirect=metadata.partition('\n')
                  if mitigation.strip().lower()=='challenge': raise ValueError('cloudflare_challenge')
                  if status=='403': raise ValueError('http_forbidden')
                  if done.returncode: raise ValueError('download_failed')
                  if status in ('301','302','303','307','308') and redirect:
                      url=urljoin(url,redirect.strip()); continue
                  if status!='200': raise ValueError('download_failed')
                  return
              raise ValueError('redirect_limit')

          def validate_compressed_member(path, timeout=20):
              data=Path(path).read_bytes(); offset=8; payload=None
              if not data.startswith(b'!<arch>\n'): raise ValueError('invalid_archive')
              while offset<len(data):
                  if len(data)-offset<60: raise ValueError('invalid_archive')
                  header=data[offset:offset+60]
                  if header[58:60]!=b'`\n': raise ValueError('invalid_archive')
                  try: size=int(header[48:58].decode('ascii').strip())
                  except (ValueError,UnicodeDecodeError): raise ValueError('invalid_archive') from None
                  if size<0 or offset+60+size>len(data): raise ValueError('invalid_archive')
                  try: name=header[:16].decode('ascii','strict').strip().rstrip('/')
                  except UnicodeDecodeError: raise ValueError('invalid_archive') from None
                  if name.startswith('#1/'): raise ValueError('invalid_archive')
                  if name.startswith('data.tar'):
                      if payload is not None: raise ValueError('invalid_payload')
                      payload=(name,data[offset+60:offset+60+size])
                  offset+=60+size
                  if size%2:
                      if offset>=len(data) or data[offset:offset+1]!=b'\n': raise ValueError('invalid_archive')
                      offset+=1
              if payload is None: raise ValueError('invalid_payload')
              name,compressed=payload; suffix=name[len('data.tar'):]
              tools={'.gz':['gzip','-t'],'.xz':['xz','-t'],'.lzma':['xz','-t'],'.bz2':['bzip2','-t'],'.zst':['zstd','-q','-t']}
              if suffix=='': return
              if suffix not in tools: raise ValueError('invalid_payload')
              fd,temp=tempfile.mkstemp(prefix='repomgr-payload-',suffix=suffix); os.close(fd)
              try:
                  Path(temp).write_bytes(compressed)
                  subprocess.run(tools[suffix]+[temp],check=True,timeout=timeout,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              except (OSError,subprocess.SubprocessError): raise ValueError('invalid_payload') from None
              finally: Path(temp).unlink(missing_ok=True)

          def validate_payload(path, maximum_bytes=512*1024*1024, maximum_entries=100000, timeout=30):
              # dpkg handles the supported compression formats; never extract package paths.
              process=subprocess.Popen(['dpkg-deb','--fsys-tarfile',str(path)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True)
              expired=threading.Event()
              def kill():
                  try:
                      if sys.platform=='linux': os.killpg(process.pid,signal.SIGKILL)
                      else: process.kill()
                  except ProcessLookupError: pass
              def timed_out():
                  expired.set(); kill()
              timer=threading.Timer(timeout,timed_out); timer.daemon=True; timer.start()
              class BoundedStream:
                  def __init__(self): self.total=0
                  def read(self,size=-1):
                      chunk=process.stdout.read(min(size if size>=0 else 32768,32768))
                      self.total+=len(chunk)
                      if self.total>maximum_bytes: raise ValueError('payload_resource_limit')
                      return chunk
              stream=BoundedStream()
              try:
                  entries=0; expanded=0
                  with tarfile.open(fileobj=stream,mode='r|') as archive:
                      for member in archive:
                          entries+=1; expanded+=member.size
                          if entries>maximum_entries or member.size<0 or expanded>maximum_bytes:
                              raise ValueError('payload_resource_limit')
                          if member.isfile():
                              with archive.extractfile(member) as content:
                                  while content.read(32768): pass
                  # Drain after the tar end marker so decompression/CRC errors surface.
                  while stream.read(32768): pass
                  status=process.wait()
                  if expired.is_set(): raise ValueError('payload_timeout')
                  if status or not entries: raise ValueError('invalid_payload')
              except Exception as error:
                  if expired.is_set(): raise ValueError('payload_timeout') from None
                  if isinstance(error,ValueError) and str(error)=='payload_resource_limit': raise
                  raise ValueError('invalid_payload') from None
              finally:
                  timer.cancel()
                  if process.poll() is None: kill()
                  process.stdout.close()
                  process.wait()

          def transfer(items):
              if not isinstance(items,list) or not 0<len(items)<=20: raise ValueError('invalid_batch')
              results=[]; seen=set()
              Path('debs').mkdir(exist_ok=True)
              for index,item in enumerate(items):
                  result={'filename':'invalid-item-'+str(index+1),'status':'failure'}; tmp=None
                  try:
                      if not isinstance(item,dict): raise ValueError('invalid_input')
                      url,name=item.get('url'),item.get('filename')
                      if not isinstance(name,str) or not re.fullmatch(r'[A-Za-z0-9._+~-]+\.deb',name) or '..' in name or name in seen: raise ValueError('invalid_filename')
                      result['filename']=name; seen.add(name)
                      expected=item.get('sha256','')
                      if not isinstance(expected,str) or not re.fullmatch(r'[A-Fa-f0-9]{64}',expected): raise ValueError('invalid_sha256')
                      fd,tmp=tempfile.mkstemp(suffix='.deb'); os.close(fd)
                      download(url,tmp)
                      data=Path(tmp).read_bytes(); digest=hashlib.sha256(data).hexdigest()
                      if len(data)>41943040 or not data.startswith(b'!<arch>\n'): raise ValueError('invalid_archive')
                      if expected.lower()!=digest: raise ValueError('checksum_mismatch')
                      validate_compressed_member(tmp)
                      fields=[subprocess.check_output(['dpkg-deb','-f',tmp,k],text=True,stderr=subprocess.PIPE).strip() for k in ['Package','Version','Architecture']]
                      if not all(fields) or not re.fullmatch(r'[a-z0-9][a-z0-9+.-]*',fields[0]): raise ValueError('invalid_control')
                      validate_payload(tmp)
                      dest=Path('debs')/re.sub(r'[^A-Za-z0-9._+-]','_', '_'.join(fields)+'.deb')
                      if len(dest.name)>240: raise ValueError('invalid_control')
                      result['repo_path']=dest.as_posix(); result['sha256']=digest
                      if dest.exists():
                          if hashlib.sha256(dest.read_bytes()).hexdigest()!=digest: raise ValueError('filename_conflict')
                          result['status']='skipped'
                      else: dest.write_bytes(data); result['status']='success'
                  except Exception as error:
                      allowed={'unsafe_url','dns_failed','download_failed','cloudflare_challenge','http_forbidden','redirect_limit','invalid_input','invalid_filename','invalid_sha256','invalid_archive','checksum_mismatch','invalid_control','invalid_payload','payload_resource_limit','payload_timeout','filename_conflict'}
                      result['error']=str(error) if isinstance(error,ValueError) and str(error) in allowed else 'transfer_failed'
                  finally:
                      if tmp: Path(tmp).unlink(missing_ok=True)
                  results.append(result)
              return results

          task=os.environ['TASK_ID']
          if not re.fullmatch('[A-Za-z0-9-]{1,64}',task): raise ValueError('invalid task identifier')
          results=transfer(json.loads(os.environ['FILES']))
          Path('.repomgr-results').mkdir(exist_ok=True)
          Path('.repomgr-results',task+'.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              for state in ['success','skipped','failure']: f.write(f"{state}: {sum(r['status']==state for r in results)}\n")
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              # Existing, verified files still need to rebuild and deploy Pages
              # after a prior run failed during indexing or deployment.
              output.write('has_changes='+str(any(row['status'] in ('success','skipped') for row in results)).lower()+'\n')
          PYTRANSFER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs .repomgr-results
          git diff --cached --quiet || git commit -m "Cloud transfer $TASK_ID"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then pushed=true; break; fi
            git fetch origin "$GITHUB_REF_NAME"
            # Never overwrite concurrent changes. A conflicting same-path update
            # fails visibly instead of silently replacing another uploader's file.
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              python3 - "$TASK_ID" <<'PYCONFLICT'
          import json,sys
          from pathlib import Path
          result=Path('.repomgr-results',sys.argv[1]+'.json')
          rows=json.loads(result.read_text(encoding='utf-8'))
          for row in rows:
              if row.get('status') in ('success','skipped'):
                  row['status']='failure'; row['error']='repository_rebase_conflict'
          result.write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          PYCONFLICT
              exit 1
            fi
            python3 - "$TASK_ID" <<'PYTREE'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          result=Path('.repomgr-results',sys.argv[1]+'.json')
          rows=json.loads(result.read_text(encoding='utf-8')); changed=False
          for row in rows:
              if row.get('status') not in ('success','skipped'): continue
              try: data=subprocess.check_output(['git','show','HEAD:'+row['repo_path']],stderr=subprocess.DEVNULL)
              except (subprocess.CalledProcessError,KeyError): data=None
              if data is None or hashlib.sha256(data).hexdigest()!=row.get('sha256'):
                  row['status']='failure'; row['error']='final_tree_conflict'; changed=True
          if changed:
              result.write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
              subprocess.run(['git','add',str(result)],check=True)
              subprocess.run(['git','commit','-m','Record cloud transfer tree conflict'],check=True,stdout=subprocess.DEVNULL)
              raise SystemExit('Rebased repository tree no longer matches the verified transfer bytes')
          PYTREE
          done
          if [ "$pushed" != true ]; then
            python3 - "$TASK_ID" <<'PUSHFAIL'
          import json,sys
          from pathlib import Path
          result=Path('.repomgr-results',sys.argv[1]+'.json')
          rows=json.loads(result.read_text(encoding='utf-8'))
          for row in rows:
              if row.get('status') in ('success','skipped'):
                  row['status']='failure'; row['error']='repository_push_failed'
          result.write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          PUSHFAIL
            echo 'Repository changed repeatedly; retry the task.' >&2
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && steps.transfer.outputs.has_changes == 'true'
      - name: Build package index
        env:
          REPOMGR_PAGES_URL: ${{ steps.pages.outputs.base_url }}
          REPOMGR_SIGNING_KEY: ${{ secrets.REPOMGR_SIGNING_KEY }}
          REPOMGR_SIGNING_PASSPHRASE: ${{ secrets.REPOMGR_SIGNING_PASSPHRASE }}
          REPOMGR_SIGNING_FINGERPRINT: ${{ vars.REPOMGR_SIGNING_FINGERPRINT }}
          REPOMGR_VALIDITY_DAYS: ${{ vars.REPOMGR_VALIDITY_DAYS || '7' }}
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && steps.transfer.outputs.has_changes == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 zstd gnupg
          #!/usr/bin/env bash
          # Shared publisher source. Both YAML templates embed this verbatim so remote
          # installers still need only the workflow, never an additional repository file.
          # Custom indexer protocol: scripts/update-repository.sh ABSOLUTE_OUTPUT_DIRECTORY
          # runs from the checkout and must create public/Packages and all site assets.
          # Its index/layout is authoritative; common compression, Release and signing
          # finalization below is mandatory for both publication entry points.
          set -euo pipefail
          export REPOMGR_SOURCE_ROOT="$PWD"
          rm -rf public
          if [ -f scripts/update-repository.sh ]; then
            bash scripts/update-repository.sh "$PWD/public"
          else
            mkdir -p public/debs
            rsync -a --exclude="/public/" --exclude="/.git/" --exclude="/.github/" --exclude="/.repomgr-results/" --exclude="/.review-fixes/" --exclude="/.optimization-fixes/" --exclude="/.gitignore" --exclude="/.gitattributes" ./ public/
            touch public/.nojekyll
            cp -f icon.png CydiaIcon.png public/ 2>/dev/null || true
            (
            cd public
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n dpkg-scanpackages --multiversion debs /dev/null > Packages
            else
              dpkg-scanpackages --multiversion debs /dev/null > Packages
            fi
          python3 - <<'PYMETADATA'
          import json,re,os
          from urllib.parse import urljoin
          from pathlib import Path
          output=[]
          for stanza in Path('Packages').read_text().split('\n\n'):
              if not stanza.strip(): continue
              match=re.search(r'^Package: ([a-z0-9][a-z0-9+.-]*)$',stanza,re.M)
              path=Path('depictions')/match[1]/'depiction.json' if match else None
              if path and path.is_file():
                  document=json.loads(path.read_text())
                  metadata=document.get('repomgr',{})
                  if not isinstance(metadata,dict): raise ValueError('Invalid display metadata')
                  fields={k:v for k,v in metadata.items() if k in ('Name','Description','Author') and isinstance(v,str)}
                  base=os.environ.get('REPOMGR_PAGES_URL','').rstrip('/')+'/'
                  fields['SileoDepiction']=urljoin(base,path.as_posix())
                  if (path.parent/'icon.png').is_file(): fields['Icon']=urljoin(base,(path.parent/'icon.png').as_posix())
                  for key,value in fields.items():
                      value=value.replace('\r','').replace('\n','\n ')
                      stanza=re.sub(r'^'+key+r':[^\n]*(?:\n[ \t][^\n]*)*\n?', '', stanza, flags=re.M)
                      stanza=stanza.rstrip()+'\n'+key+': '+value
              output.append(stanza)
          Path('Packages').write_text('\n\n'.join(output)+'\n\n')
          PYMETADATA
            )
          fi
          cd public
          [ -f Packages ] && [ ! -L Packages ] || { echo 'Indexer must produce public/Packages' >&2; exit 1; }
          touch .nojekyll
          # Always regenerate compressed variants, including ones copied from an old source.
          python3 - <<'PYRELEASE'
          import bz2, gzip, hashlib, lzma, os, re, subprocess, tempfile
          from datetime import datetime, timedelta, timezone
          from email.utils import format_datetime
          from pathlib import Path
          root=Path('.')
          source=Path(os.environ['REPOMGR_SOURCE_ROOT'])
          signed=any((base/name).exists() for base in (root,source) for name in ('InRelease','Release.gpg'))
          key=os.environ.get('REPOMGR_SIGNING_KEY','')
          if signed and not key.strip():
              raise SystemExit('Signed repository requires REPOMGR_SIGNING_KEY (and optional REPOMGR_SIGNING_PASSPHRASE); refusing stale signatures')
          # Root Packages is the shared indexer contract. Reject unsupported variants rather
          # than publishing an old index with freshly calculated (but misleading) hashes.
          data=Path('Packages').read_bytes()
          Path('Packages.gz').write_bytes(gzip.compress(data,mtime=0))
          Path('Packages.bz2').write_bytes(bz2.compress(data))
          for suffix,fmt in (('xz',lzma.FORMAT_XZ),('lzma',lzma.FORMAT_ALONE)):
              p=Path('Packages.'+suffix)
              if p.exists(): p.write_bytes(lzma.compress(data,format=fmt))
          if Path('Packages.zst').exists():
              subprocess.run(['zstd','-q','-f','Packages','-o','Packages.zst'],check=True)
          release=Path('Release')
          old=release if release.is_file() else source/'Release'
          text=old.read_text(encoding='utf-8') if old.is_file() else ''
          # InRelease-only repositories still have identity metadata worth preserving.
          if not text:
              inline=next((base/'InRelease' for base in (root,source) if (base/'InRelease').is_file()),None)
              if inline:
                  armored=inline.read_text(encoding='utf-8')
                  if '\n\n' not in armored or '\n-----BEGIN PGP SIGNATURE-----' not in armored:
                      raise SystemExit('Malformed existing InRelease')
                  text=armored.split('\n\n',1)[1].split('\n-----BEGIN PGP SIGNATURE-----',1)[0]
                  text='\n'.join(line[2:] if line.startswith('- ') else line for line in text.splitlines())
          identity=[]; skip=False; seen=set()
          for line in text.splitlines():
              if line.startswith((' ','\t')):
                  if not skip:
                      if not identity: raise SystemExit('Malformed Release continuation')
                      identity.append(line)
                  continue
              if not line.strip(): continue
              match=re.fullmatch(r'([A-Za-z0-9-]+):[ \t]*(.*)',line)
              if not match: raise SystemExit('Malformed Release field')
              field=match[1].lower()
              if field in seen: raise SystemExit('Duplicate Release field: '+field)
              seen.add(field)
              skip=field in ('md5sum','sha1','sha256','sha512','date','valid-until')
              if not skip: identity.append(line)
          if not identity:
              name=os.environ.get('GITHUB_REPOSITORY','repository').rsplit('/',1)[-1]
              identity=[f'Origin: {name}',f'Label: {name}','Suite: stable','Codename: sileo','Architectures: iphoneos-arm64 iphoneos-arm64e','Components: main',f'Description: {name}']
          identity.append('Date: '+format_datetime(datetime.now(timezone.utc),usegmt=True))
          try:
              validity_days=int(os.environ.get('REPOMGR_VALIDITY_DAYS','7'))
          except ValueError: raise SystemExit('REPOMGR_VALIDITY_DAYS must be an integer from 1 to 90')
          if not 1<=validity_days<=90: raise SystemExit('REPOMGR_VALIDITY_DAYS must be an integer from 1 to 90')
          identity.append('Valid-Until: '+format_datetime(datetime.now(timezone.utc)+timedelta(days=validity_days),usegmt=True))
          # Hash repository index files, never Release itself, signatures, packages or assets.
          indexes=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and re.fullmatch(r'(?:Packages|Sources|Contents-[A-Za-z0-9_-]+|Translation-[A-Za-z0-9_-]+)(?:\.(?:gz|bz2|xz|lzma|zst))?',p.name):
                  if p.is_symlink(): raise SystemExit('Symlink index not allowed')
                  indexes.append((p.as_posix(),p.read_bytes()))
          for field,algorithm in (('MD5Sum','md5'),('SHA1','sha1'),('SHA256','sha256'),('SHA512','sha512')):
              identity.append(field+':')
              for name,content in indexes:
                  identity.append(f' {hashlib.new(algorithm,content).hexdigest()} {len(content)} {name}')
          release.write_text('\n'.join(identity)+'\n',encoding='utf-8')
          for name in ('InRelease','Release.gpg'):
              Path(name).unlink(missing_ok=True)
          if key.strip():
              # A private temporary keyring avoids shared runner state and key leakage.
              with tempfile.TemporaryDirectory(prefix='repomgr-gpg-') as home:
                  os.chmod(home,0o700)
                  env=dict(os.environ,GNUPGHOME=home)
                  subprocess.run(['gpg','--batch','--import'],input=key.encode(),env=env,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=90)
                  listing=subprocess.check_output(['gpg','--batch','--with-colons','--list-secret-keys'],env=env,text=True,timeout=90)
                  fingerprints=[]; primary=False
                  for line in listing.splitlines():
                      fields=line.split(':')
                      if fields[0]=='sec': primary=True
                      elif fields[0]=='ssb': primary=False
                      elif fields[0]=='fpr' and primary:
                          fingerprints.append(fields[9]); primary=False
                  fingerprint=os.environ.get('REPOMGR_SIGNING_FINGERPRINT','').strip()
                  if fingerprint:
                      if fingerprint not in fingerprints: raise SystemExit('Configured signing fingerprint not present')
                  elif len(fingerprints)==1: fingerprint=fingerprints[0]
                  else: raise SystemExit('Configure exactly one signing key or REPOMGR_SIGNING_FINGERPRINT')
                  common=['gpg','--batch','--yes','--pinentry-mode','loopback','--passphrase-fd','0','--local-user',fingerprint,'--digest-algo','SHA256']
                  password=(os.environ.get('REPOMGR_SIGNING_PASSPHRASE','')+'\n').encode()
                  subprocess.run(common+['--armor','--detach-sign','--output','Release.gpg','Release'],input=password,env=env,check=True,timeout=90)
                  subprocess.run(common+['--clearsign','--output','InRelease','Release'],input=password,env=env,check=True,timeout=90)
          PYRELEASE
          if [ ! -f index.html ]; then
            printf '<!doctype html><meta charset=utf-8><meta name=viewport content=width=device-width><title>APT Repository</title><h1>APT Repository</h1><p>添加此地址到 Sileo。</p>' > index.html
          fi
      - name: Record publication provenance
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && steps.transfer.outputs.has_changes == 'true'
        shell: bash
        run: |
          python3 - <<'PYPROVENANCE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('public')
          index=root/'Packages'
          if not index.is_file(): raise SystemExit('Missing published Packages index')
          manifest={'schema':1,'repository':os.environ['GITHUB_REPOSITORY'],'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runID':os.environ['GITHUB_RUN_ID'],'indexSHA256':hashlib.sha256(index.read_bytes()).hexdigest()}
          (root/'.repomgr-publication.json').write_text(json.dumps(manifest)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('\nPublication commit: `'+manifest['commit']+'`\nIndex SHA256: `'+manifest['indexSHA256']+'`\n')
          PYPROVENANCE
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && steps.transfer.outputs.has_changes == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && steps.transfer.outputs.has_changes == 'true'
      - name: Summarize per-file transfer outcome
        if: always()
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]] || exit 0
          result=".repomgr-results/${TASK_ID}.json"
          if [ ! -f "$result" ]; then
            echo "No per-file result was produced; inspect the failed transfer step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$result" "$GITHUB_STEP_SUMMARY" "$DEPLOY_OUTCOME" <<'PYOUTCOME'
          import json,sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          counts={state:sum(row.get('status')==state for row in rows) for state in ('success','skipped','failure')}
          with open(sys.argv[2],'a',encoding='utf-8') as summary:
              summary.write(f"\n### RepoMgr final outcome\n- Transferred files: {counts['success']}\n- Already present: {counts['skipped']}\n- Failed files: {counts['failure']}\n- Pages deployment: {sys.argv[3]}\n")
          if counts['failure']:
              print(f"Per-file transfer had {counts['failure']} failure(s); Pages deployment outcome: {sys.argv[3]}",file=sys.stderr)
              raise SystemExit(1)
          if counts['success']+counts['skipped']==0:
              print('No file was transferred or already present.',file=sys.stderr)
              raise SystemExit(1)
          if sys.argv[3] != 'success':
              print('Files may be committed, but Pages is not published. Retry deployment.',file=sys.stderr)
              raise SystemExit(1)
          PYOUTCOME
